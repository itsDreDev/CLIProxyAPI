name: desktop-app

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'gui/**'
      - 'scripts/prepare-desktop.mjs'
      - '.github/workflows/desktop.yml'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'sdk/**'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'gui/**'
      - 'scripts/prepare-desktop.mjs'
      - '.github/workflows/desktop.yml'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'sdk/**'

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --prefix desktop
      - run: npm run build --prefix desktop
      - run: node --test desktop/tests/*.test.mjs
      - name: Install browser
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e --prefix desktop
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            gui/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix gui
          npm ci --prefix desktop
      - name: Prepare bundled proxy and dashboard
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run prepare:proxy --prefix desktop
      - name: Test native proxy ownership and configuration
        working-directory: desktop/src-tauri
        run: cargo test --locked --no-default-features -- --include-ignored
      - name: Build desktop installers
        run: npm run tauri --prefix desktop -- build
      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: subscription-desk-${{ matrix.os }}
          path: desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
