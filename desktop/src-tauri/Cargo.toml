[package]
name = "subscription-desk-desktop"
version = "0.1.0"
description = "Native controls for a shared subscription proxy"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[lib]
name = "subscription_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "subscription-desk-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-clipboard-manager", "dep:tauri-plugin-opener"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", optional = true, features = ["tray-icon"] }
tauri-plugin-clipboard-manager = { version = "=2.4.1", optional = true }
tauri-plugin-opener = { version = "=2.7.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rand = "0.9"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
