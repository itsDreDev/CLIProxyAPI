services:
  cli-proxy-api:
    # Build this checkout, including its embedded subscription dashboard.
    image: ${CLI_PROXY_IMAGE:-subscription-desk:local}
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # Linux host networking preserves loopback management checks through Serve.
    # The private profile binds 127.0.0.1; no LAN or OAuth callback ports are published.
    network_mode: host
    user: ${CLI_PROXY_USER:?Run setup-subscriptions.mjs --docker and pass --env-file docker-data/runtime.env}
    environment:
      HOME: /tmp
    command: ["./CLIProxyAPI", "--config", "/CLIProxyAPI/config/config.yaml", "--local-model"]
    volumes:
      - type: bind
        source: ./docker-data/config
        target: /CLIProxyAPI/config
        bind:
          create_host_path: false
      - type: bind
        source: ./docker-data/auths
        target: /CLIProxyAPI/auths
        bind:
          create_host_path: false
      - type: bind
        source: ./docker-data/logs
        target: /CLIProxyAPI/logs
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:${CLI_PROXY_HEALTH_PORT:-8317}/subscriptions/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
